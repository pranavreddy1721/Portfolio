<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body data-theme="dark">
  <nav class="navbar">
    <div class="nav-content">
      <span class="logo">🔒 Admin Dashboard</span>
      <div class="nav-right">
        <a href="index.html" target="_blank">View Site &#8599;</a>
        <button id="logoutBtn" class="btn btn-outline">Logout</button>
      </div>
    </div>
  </nav>

  <main class="dashboard">

    <div class="tabs">
      <button class="tab-btn active" data-tab="projectsTab">Projects</button>
      <button class="tab-btn" data-tab="messagesTab">Messages <span id="unreadBadge" class="unread-badge" style="display:none;"></span></button>
    </div>

    <!-- PROJECTS TAB -->
    <section id="projectsTab" class="tab-content active">
      <section class="task-form-card">
        <h2 id="formTitle">Add New Project</h2>
        <form id="projectForm">
          <input type="hidden" id="projectId" />

          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="e.g. Task Manager App" required />
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" rows="3" placeholder="Brief description of the project..." required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="techStack">Tech Stack (comma-separated)</label>
              <input type="text" id="techStack" placeholder="React, Node.js, MongoDB" />
            </div>
            <div class="form-group">
              <label for="order">Display Order</label>
              <input type="number" id="order" placeholder="0" value="0" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="githubUrl">GitHub URL</label>
              <input type="url" id="githubUrl" placeholder="https://github.com/..." />
            </div>
            <div class="form-group">
              <label for="liveUrl">Live Demo URL</label>
              <input type="url" id="liveUrl" placeholder="https://..." />
            </div>
          </div>

          <div class="form-group">
            <label for="imageUrl">Image URL (optional thumbnail)</label>
            <input type="url" id="imageUrl" placeholder="https://..." />
          </div>

          <div class="form-group checkbox-group">
            <input type="checkbox" id="featured" />
            <label for="featured">Mark as Featured</label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">Add Project</button>
            <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none;">Cancel</button>
          </div>
        </form>
      </section>

      <div class="task-list" id="projectsList">
        <p class="empty-state" id="emptyState">No projects yet. Add your first one above.</p>
      </div>
    </section>

    <!-- MESSAGES TAB -->
    <section id="messagesTab" class="tab-content">
      <div class="task-list" id="messagesList">
        <p class="empty-state" id="messagesEmptyState">No messages yet.</p>
      </div>
    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
